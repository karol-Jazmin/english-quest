<body class="adm-body">
<a class="admin-link" href="../">← Volver al juego</a>
<div id="app" class="adm"></div>
<script>
/* En GitHub Pages no hay servidor: se avisa con un mensaje claro en vez de un error técnico. */
(() => {
  const real = window.fetch.bind(window);
  window.fetch = async (url, opts) => {
    try { const r = await real(url, opts); if ((r.headers.get('content-type') || '').includes('json')) return r; } catch (e) {}
    return new Response(JSON.stringify({ error: 'El panel de la profesora solo funciona cuando el servidor del juego está encendido.' }),
      { status: 503, headers: { 'Content-Type': 'application/json' } });
  };
})();
</script>
<script src="../static/pixel.js"></script>
<script src="../static/admin.js"></script>
</body>
</html>
